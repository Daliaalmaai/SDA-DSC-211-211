name: Bilingual Documentation Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bilingual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check Arabic and English documentation
        run: python scripts/check_bilingual_content.py --output check-output/bilingual-content.json
